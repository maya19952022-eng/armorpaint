name: macOS (Metal)

on:
  push:
    branches:
    - main
  pull_request: # Any base, phase PRs can stack on the previous phase
  workflow_dispatch: # Run by hand from the Actions tab

jobs:
  build:

    runs-on: macOS-latest

    steps:
    - uses: actions/checkout@v3
    - name: Compile
      run: |
        cd paint
        ../base/make --compile
