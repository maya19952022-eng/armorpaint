name: Linux (Vulkan)

on:
  push:
    branches:
    - main
  pull_request: # Any base, phase PRs can stack on the previous phase
  workflow_dispatch: # Run by hand from the Actions tab

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Apt Update
      run: sudo apt-get update
    - name: Apt Install
      run: sudo apt install make clang libvulkan-dev libgtk-3-dev libasound2-dev --yes --quiet
    - name: Compile
      run: |
        cd paint
        ../base/make --compile
    - name: Smoke Test
      run: |
        sudo apt install xvfb mesa-vulkan-drivers --yes --quiet
        base/tests/paint_headless/run.sh
