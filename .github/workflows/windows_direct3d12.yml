name: Windows (Direct3D12)

on:
  push:
    branches:
    - main
  pull_request: # Any base, phase PRs can stack on the previous phase

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Compile
      run: |
        cd paint
        ../base/make --compile
