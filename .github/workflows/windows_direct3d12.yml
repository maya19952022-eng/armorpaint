name: Windows (Direct3D12)

on:
  push:
    branches:
    - main
  pull_request: # Any base, phase PRs can stack on the previous phase
  workflow_dispatch: # Run by hand from the Actions tab

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Compile
      run: |
        cd paint
        ../base/make --compile
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-windows
        path: paint/build/out
        if-no-files-found: error
